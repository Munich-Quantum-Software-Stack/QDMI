[build-system]
build-backend = "scikit_build_core.build"
requires = [ "scikit-build-core>=1.0.1" ]


[project]
name = "cxx-qdmi"
version = "0.1.0"
description = "Implementation of a CXX QDMI device"
readme = "README.md"
license = "Apache-2.0 WITH LLVM-exception"
license-files = [ "LICENSE" ]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering :: Quantum Computing",
  "Typing :: Typed",
]

[[project.authors]]
name = "John Doe"
email = "john.doe@example.com"

[[project.authors]]
name = "Jane Smith"
email = "jane.smith@example.com"

[project.urls]
Homepage = "https://github.com/cxx-org/cxx-qdmi"
Issues = "https://github.com/cxx-org/cxx-qdmi/issues"
Discussions = "https://github.com/cxx-org/cxx-qdmi/discussions"

[project.scripts]
cxx-qdmi = "cxx.qdmi.__main__:main"


[dependency-groups]
dev = [
  { include-group = "test" },
  "nox>=2026.4.10",
]
test = [
  "pytest>=9.0.3",
  "pytest-console-scripts>=1.4.1",
  "pytest-cov>=7.1",
  "pytest-sugar>=1.1.1",
  "pytest-xdist>=3.8",
]


[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}/{build_type}"

[tool.scikit-build.build]
targets = [ "cxx-qdmi-device" ]

[tool.scikit-build.cmake]
version = "CMakeLists.txt"

[tool.scikit-build.cmake.define]
BUILD_CXX_QDMI_DOCS = "OFF"
BUILD_CXX_QDMI_TESTS = "OFF"

[tool.scikit-build.ninja]
make-fallback = true

[tool.scikit-build.sdist]

include = [ "python/cxx/qdmi/_version.py" ]
exclude = [
  "**/docs",
  "**/test",
  "sitecustomize.py",
  ".*",
]

[tool.scikit-build.wheel]
py-api = "py311"
expand-macos-universal-tags = true
packages = [ "python/cxx" ]
install-dir = "cxx/qdmi/data"

[tool.scikit-build.install]
components = [ "cxx-qdmi-device_Runtime", "cxx-qdmi-device_Development" ]

[[tool.scikit-build.generate]]
path = "cxx/qdmi/_version.py"
template = '''
version = "${version}"
'''


[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { git = { commit = true, tags = true } },
  { file = "src/**/*" },
]

[tool.uv.sources]
cxx-qdmi = { workspace = true }


[tool.cibuildwheel]
build = "cp3*"
archs = "auto64"
build-frontend = "uv"
test-command = "pytest test/python"
test-groups = [ "test" ]
test-sources = [ "test/python" ]

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "13.3" }

[tool.cibuildwheel.windows]
repair-wheel-command = "delvewheel repair -w {dest_dir} {wheel} --namespace-pkg cxx"


[tool.ruff]
line-length = 120
namespace-packages = [ "cxx" ]
src = [ "python" ]
preview = true
fix = true
unsafe-fixes = true
show-fixes = true

[tool.ruff.lint.per-file-ignores]
"python/cxx/qdmi/__main__.py" = [ "T201" ]
"test/python/**" = [ "INP001", "T20" ]

[tool.ruff.lint.isort]
known-first-party = [ "cxx.qdmi" ]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [ "ALL" ]
ignore = [
  "C90",     # <...> too complex
  "COM812",  # Conflicts with formatter
  "PLR09",   # Too many <...>
  "PLR2004", # Magic value used in comparison
  "S101",    # Use of assert detected
  "S404",    # `subprocess` module is possibly insecure
  "TID252"  # Prefer absolute imports over relative imports from parent modules
]
future-annotations = true


[tool.pyproject-fmt]
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"
separate_root_table = "\n\n"


[tool.ty.src]
exclude = [
  "docs/**",
]

[tool.ty.terminal]
# Error if ty emits any warning-level diagnostics.
error-on-warning = true


[tool.pytest]
addopts = [
  "-ra",
  "--numprocesses=auto", # Automatically use all available CPU cores for parallel testing
]
filterwarnings = [
  "error",
]
log_level = "INFO"
minversion = "9.0"
strict = true
testpaths = [ "test/python" ]


[tool.coverage]

[tool.coverage.run]
source = [ "cxx.qdmi" ]
disable_warnings = [
  "no-sysmon",
]

[tool.coverage.report]
exclude_also = [
  "@overload",                 # Overloads are only for static typing
  '\.\.\.',
  "def __dir__()",             # Ignore __dir__ method that exists mainly for better IDE support
  "if TYPE_CHECKING:",
  "raise AssertionError",
  "raise NotImplementedError"
]
