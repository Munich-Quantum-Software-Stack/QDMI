name: 📝 Build and Deploy Docs
on:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Doxygen
        if: github.event.action != 'closed'
        uses: ssciwr/doxygen-install@b5b80f5a60852f72d3c33f47fee9ddfb84a25929 # v2.0.2
        with:
          version: "1.16.1"
      - name: Install and Build 🔧
        if: github.event.action != 'closed'
        run: |
          cmake -S . -B build -DBUILD_QDMI_DOCS=ON
          cmake --build build --target qdmi-docs
          mv build/docs/html/ static
          cp build/docs/qdmi.tag static/qdmi.tag
      - name: Inject version selector
        if: github.event.action != 'closed'
        run: |
          chmod +x .github/scripts/inject-version-selector.sh
          .github/scripts/inject-version-selector.sh static
      - name: Deploy preview 🚀 (for PRs; not for forks)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: ./static/
      - name: Deploy 🚀
        if: github.ref == 'refs/heads/develop' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f # v4.8.0
        with:
          folder: static
          target-folder: latest
          clean-exclude: pr-preview/
          force: false
