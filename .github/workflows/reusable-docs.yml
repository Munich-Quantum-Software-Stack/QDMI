name: 📝 Build and Deploy Docs
on:
  workflow_call:
permissions:
  contents: write
  pull-requests: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Install Doxygen
        if: github.event.action != 'closed'
        uses: ssciwr/doxygen-install@501e53b879da7648ab392ee226f5b90e42148449 # v1.6.4
        with:
          version: "1.15.0"
      - name: Install and Build 🔧
        if: github.event.action != 'closed'
        run: |
          cmake -S . -B build -DBUILD_QDMI_DOCS=ON
          cmake --build build --target qdmi_docs
          mv build/docs/html/ static
      - name: Inject version selector
        if: github.event.action != 'closed'
        run: |
          chmod +x .github/scripts/inject-version-selector.sh
          .github/scripts/inject-version-selector.sh static
      - name: Deploy preview 🚀 (for PRs; not for forks)
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: rossjrw/pr-preview-action@8ff09e486b4c23709012eedd3b42e9f0b95dd0c5 # v1.6.3
        with:
          source-dir: ./static/
      - name: Deploy 🚀
        if: github.ref == 'refs/heads/develop' && github.event.action != 'closed'
        uses: JamesIves/github-pages-deploy-action@9d877eea73427180ae43cf98e8914934fe157a1a # v4.7.6
        with:
          folder: static
          target-folder: latest
          clean-exclude: pr-preview/
          force: false
