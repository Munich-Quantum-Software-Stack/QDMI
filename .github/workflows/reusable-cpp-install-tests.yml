name: 🇨‌ • Install and Test
on:
  workflow_call:
    inputs:
      cmake-args:
        description: "Additional arguments to pass to CMake on every OS"
        default: ""
        type: string

permissions:
  contents: read

jobs:
  cpp-tests-install:
    name: ${{ matrix.name }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: 🐧
            os: ubuntu-latest
          - name: 🍎
            os: macos-15-intel
          - name: 🍎
            os: macos-14
      fail-fast: false
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    steps:
      # check out the repository (including submodules and all history)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      # set up ccache for faster C++ builds
      - name: Setup ccache
        uses: Chocobo1/setup-ccache-action@802ec72ba1d54bbf75c52f45367253d6abec30f5 # v1.5.8
        with:
          prepend_symlinks_to_path: false
          override_cache_key: c++-tests-install-${{ matrix.os }}
      # set up mold as linker for faster C++ builds
      - name: Set up mold as linker
        uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      # make sure ninja is installed
      - name: Install Ninja
        run: pipx install ninja
      # configure CMake
      - name: Configure CMake for QDMI Installation
        run: cmake -S . -B install-build -DCMAKE_BUILD_TYPE=Release ${{ inputs.cmake-args }}
      # build the project
      - name: Build the project
        run: cmake --build install-build --config Release
      # install the project
      - name: Install QDMI
        run: cmake --install install-build --prefix install-dir
      # configure CMake for using the installed QDMI
      - name: Configure CMake for use of installed QDMI
        run:
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_INSTALLED_QDMI=ON -DBUILD_CXX_QDMI_TESTS=ON
          -DCMAKE_PREFIX_PATH=install-dir ${{ inputs.cmake-args }}
      # build the project
      - name: Build QDMI examples, templates, and tests with installed QDMI
        run: cmake --build build --config Release
      # run the tests
      - name: Test
        run: ctest -C Release --output-on-failure --test-dir build --repeat until-pass:3 --timeout 600
