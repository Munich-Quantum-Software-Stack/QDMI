name: 🇨 • CI
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  cpp-tests-ubuntu:
    name: 🐧 ${{ matrix.preset }}
    strategy:
      matrix:
        preset: [debug, release]
      fail-fast: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@ae4c1005796fedc123c3c70cdba94ce643c9fcae # v2.3.1
    with:
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🍎
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@ae4c1005796fedc123c3c70cdba94ce643c9fcae # v2.3.1
    with:
      preset-name: release

  cpp-tests-install:
    name: 📦 Install
    uses: $/.github/workflows/reusable-cpp-install-tests.yml
    with:
      cmake-args: "-G Ninja -DBUILD_QDMI_DOCS=OFF"

  coverage:
    name: 📈
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ninja
        run: pipx install ninja
      - name: Configure CMake
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          flags: cpp
          use_oidc: true
