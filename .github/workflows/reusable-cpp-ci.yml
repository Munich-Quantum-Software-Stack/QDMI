name: 🇨‌ • CI
on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  cpp-tests-ubuntu:
    name: 🐧 ${{ matrix.preset }}
    strategy:
      matrix:
        preset: [debug, release]
      fail-fast: false
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-ubuntu.yml@143bf51e7192c31e76abafe58e3732c5aff9c69b # v2.0.1
    with:
      preset-name: ${{ matrix.preset }}

  cpp-tests-macos:
    name: 🍎
    uses: munich-quantum-toolkit/workflows/.github/workflows/reusable-cpp-tests-macos.yml@143bf51e7192c31e76abafe58e3732c5aff9c69b # v2.0.1
    with:
      preset-name: release

  cpp-tests-install:
    name: 📦 Install
    uses: ./.github/workflows/reusable-cpp-install-tests.yml
    with:
      cmake-args: "-G Ninja -DQDMI_BUILD_DOCS=OFF"

  coverage:
    name: 📈
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      CTEST_PARALLEL_LEVEL: 4
      FORCE_COLOR: 3
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Ninja
        run: pipx install ninja
      - name: Configure CMake
        run: cmake --preset coverage
      - name: Build
        run: cmake --build --preset coverage
      - name: Test
        run: ctest --preset coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          fail_ci_if_error: true
          flags: cpp
          use_oidc: true
