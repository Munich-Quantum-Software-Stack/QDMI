name: Release Drafter

on:
  push:
    branches:
      - develop
      - v1.2.x

permissions: {}

jobs:
  update_release_draft:
    name: Run
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@139054aeaa9adc52ab36ddf67437541f039b88e2 # v7.1.1
